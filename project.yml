name: OnMyWay
options:
  bundleIdPrefix: com.onmyway
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: 26.13.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OnMyWay:
    type: application
    platform: iOS
    sources: [OnMyWay]
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onmyway.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: On My Way
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: While you're delivering, your location shows the student where their order is.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
